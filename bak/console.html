<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURORA Update Control</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#060914;--pn:#0c1226;--ln:rgba(77,225,255,.22);--tx:#d7e4f5;--mu:#7b8aa6;--cy:#4de1ff;--vi:#8b7bff;--ok:#46f0a0;--wn:#ffb84d;--er:#ff5d7a;
--ui:"Chakra Petch","Malgun Gothic",sans-serif;--mo:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.5 var(--ui);
background:radial-gradient(900px 500px at 85% -10%,rgba(139,123,255,.18),transparent),radial-gradient(700px 420px at 0 0,rgba(77,225,255,.12),transparent),
linear-gradient(rgba(77,225,255,.04) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(77,225,255,.04) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
.pn{background:linear-gradient(160deg,rgba(18,26,52,.92),rgba(10,15,32,.92));border:1px solid var(--ln);padding:16px;
clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
header{display:flex;align-items:center;gap:28px;padding:20px 28px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.04em}h1 small{display:block;color:var(--mu);font-size:12px;font-weight:400;letter-spacing:0}
.gauge{position:relative;width:96px;height:96px}.gauge svg{transform:rotate(-90deg)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font:600 22px var(--mo)}
.stat{display:flex;gap:26px;margin-left:auto}.stat div{font:600 26px var(--mo)}.stat span{display:block;font:400 12px var(--ui);color:var(--mu)}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:18px;padding:0 28px 18px}
@media(max-width:1000px){main{grid-template-columns:1fr}}
h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--cy)}
.bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.bar em{color:var(--mu);font-style:normal;margin-right:auto}
button,select{font:inherit;color:var(--tx);background:rgba(77,225,255,.08);border:1px solid var(--ln);padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--cy);background:rgba(77,225,255,.18)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cy)}
button.pri{background:linear-gradient(90deg,var(--cy),var(--vi));color:#06101c;border:0;font-weight:600}
button.on{border-color:var(--cy);background:rgba(77,225,255,.22)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}
th{color:var(--mu);font-weight:400;text-align:left;padding:6px 10px;border-bottom:1px solid var(--ln)}
td{padding:8px 10px;border-bottom:1px solid rgba(77,225,255,.08)}td.m{font-family:var(--mo);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--mu)}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.tag{padding:1px 8px;border:1px solid;font-size:12px}.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}.tag.er{color:var(--er)}
textarea{width:100%;height:280px;resize:vertical;background:#050812;color:#bfe9ff;border:1px solid var(--ln);padding:10px;font:12px/1.5 var(--mo)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#log{height:170px;overflow:auto;font:12px/1.7 var(--mo);color:#9fb4d3}#log i{color:var(--mu);font-style:normal}
#log .FAIL{color:var(--er)}#log .OK{color:var(--ok)}
input.t{font:inherit;color:var(--tx);background:#050812;border:1px solid var(--ln);padding:5px 10px;width:200px}
td.t{white-space:normal;min-width:240px;max-width:520px}
.empty{color:var(--mu);padding:28px;text-align:center}
@media(prefers-reduced-motion:no-preference){.gauge circle:last-child{transition:stroke-dashoffset .8s}}
</style></head><body>
<header>
 <div class="gauge"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(77,225,255,.15)" stroke-width="7"/>
 <circle id="arc" cx="48" cy="48" r="40" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
 <defs><linearGradient id="g"><stop stop-color="#4de1ff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs></svg><b id="pct">–</b></div>
 <h1>AURORA Update Control<small>정책 적용률 · 윈도우 업데이트 중앙 관리</small></h1>
 <div class="stat"><div id="s1">–<span>온라인</span></div><div id="s2">–<span>정책 대기</span></div><div id="s3">–<span>재부팅 필요</span></div></div>
</header>
<main>
 <section class="pn">
  <h2>PC 목록</h2>
  <div class="bar"><em id="selc">선택 0대</em>
   <button onclick="cmd('scan')">목록 새로고침</button><button onclick="cmd('installall')">차단 외 모두 설치</button><button onclick="cmd('reboot')">재부팅(60초)</button></div>
  <div class="tw"><table><thead><tr><th><input type="checkbox" id="all" aria-label="전체 선택"></th><th>PC</th><th>IP</th><th>링</th><th>윈도우</th><th>정책</th><th>재부팅</th><th>최근 KB</th><th>마지막 응답</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="empty" id="empty" hidden>아직 연결된 에이전트가 없습니다. 대상 PC에서 agent.py를 실행하세요.</div>
 </section>
 <section class="pn">
  <h2>링 정책</h2>
  <div class="bar" id="tabs"></div>
  <div class="pre" id="pre"></div>
  <textarea id="pol" spellcheck="false" aria-label="정책 JSON"></textarea>
  <div class="bar" style="margin:10px 0 0"><em id="ph"></em><button class="pri" onclick="savePol()">정책 저장·배포</button></div>
 </section>
</main>
<section class="pn" style="margin:0 28px 18px">
 <h2>업데이트 센터</h2>
 <div class="bar">
  <button data-view="pend" class="on">대기 중</button><button data-view="hist">설치 기록</button>
  <select id="fpc" aria-label="PC 필터"></select><select id="fring" aria-label="규칙 범위"></select>
  <input class="t" id="kbin" placeholder="KB 번호 (예: KB5050009)" aria-label="KB 번호">
  <button onclick="addRule('block')">차단 등록</button><button onclick="addRule('allow')">허용 등록</button>
  <em id="updts" style="margin:0 0 0 auto"></em></div>
 <div class="tw"><table><thead id="uh"></thead><tbody id="ub"></tbody></table></div>
</section>
<section class="pn" style="margin:0 28px 28px"><h2>이벤트</h2><div id="log"></div></section>
<script>
const WU="SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate",OF="SOFTWARE\\Policies\\Microsoft\\office\\16.0\\common\\officeupdate";
const PRESETS={
 "품질 업데이트 7일 지연":[{path:WU,name:"DeferQualityUpdates",type:"DWORD",value:1},{path:WU,name:"DeferQualityUpdatesPeriodInDays",type:"DWORD",value:7}],
 "24H2 버전 고정":[{path:WU,name:"ProductVersion",type:"SZ",value:"Windows 11"},{path:WU,name:"TargetReleaseVersion",type:"DWORD",value:1},{path:WU,name:"TargetReleaseVersionInfo",type:"SZ",value:"24H2"}],
 "드라이버 업데이트 차단":[{path:WU,name:"ExcludeWUDriversInQualityUpdate",type:"DWORD",value:1}],
 "Office 월간 엔터프라이즈 채널":[{path:OF,name:"EnableAutomaticUpdates",type:"DWORD",value:1},{path:OF,name:"UpdateBranch",type:"SZ",value:"MonthlyEnterprise"}]};
let TOKEN=sessionStorage.t||prompt("관리자 토큰 (서버 시작 시 출력됨)")||"";sessionStorage.t=TOKEN;
let S=null,sel=new Set(),ring="ring0",loaded=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,b){const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"X-Admin":TOKEN,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
 if(r.status==401){sessionStorage.t="";alert("토큰이 올바르지 않습니다. 새로고침 후 다시 입력하세요.");throw 0}return r.json()}
const ago=t=>{if(!t)return"–";const s=S.now-t;return s<60?"방금":s<3600?Math.floor(s/60)+"분 전":s<86400?Math.floor(s/3600)+"시간 전":Math.floor(s/86400)+"일 전"};
function render(){
 const A=S.agents,on=a=>S.now-a.last_seen<90,ok=a=>a.applied&&a.applied===a.target;
 const p=A.length?Math.round(100*A.filter(ok).length/A.length):0;
 $("#pct").textContent=A.length?p+"%":"–";$("#arc").style.strokeDashoffset=251.3*(1-p/100);
 $("#s1").firstChild.textContent=A.filter(on).length+"/"+A.length;$("#s2").firstChild.textContent=A.filter(a=>!ok(a)).length;$("#s3").firstChild.textContent=A.filter(a=>a.reboot).length;
 $("#empty").hidden=A.length>0;$("#selc").textContent="선택 "+sel.size+"대";
 $("#rows").innerHTML=A.map(a=>`<tr><td><input type="checkbox" data-id="${esc(a.id)}" ${sel.has(a.id)?"checked":""} aria-label="${esc(a.host)} 선택"></td>
 <td><span class="dot ${on(a)?"on":""}"></span>${esc(a.host)}</td><td class="m">${esc(a.ip)}</td>
 <td><select data-ring="${esc(a.id)}">${Object.keys(S.policies).map(r=>`<option ${r==a.ring?"selected":""}>${r}</option>`).join("")}</select></td>
 <td class="m">${esc(a.build)}</td><td><span class="tag ${ok(a)?"ok":"wn"}">${ok(a)?"적용됨":"대기"}</span></td>
 <td>${a.reboot?'<span class="tag er">필요</span>':"–"}</td><td class="m">${esc((a.hot||"").split(",")[0]||"–")}</td><td>${ago(a.last_seen)}</td></tr>`).join("");
 $("#tabs").innerHTML=Object.keys(S.policies).map(r=>`<button class="${r==ring?"on":""}" data-tab="${r}">${r}</button>`).join("");
 $("#pre").innerHTML=Object.keys(PRESETS).map(k=>`<button data-pre="${esc(k)}">+ ${esc(k)}</button>`).join("");
 if(loaded!==ring){$("#pol").value=JSON.stringify(S.policies[ring].items,null,2);loaded=ring}
 $("#ph").textContent="배포 중인 정책 "+S.policies[ring].hash;
 $("#log").innerHTML=S.events.map(e=>{const k=/^(OK|FAIL)/.exec(e.msg);return`<div class="${k?k[1]:""}"><i>${new Date(e.ts*1e3).toLocaleTimeString("ko-KR")}</i> ${esc(e.host)} ${esc(e.msg)}</div>`}).join("");
}
async function tick(){try{S=await api("state");render();renderUpd()}catch(e){}}
let view="pend",fpc="*",fscope="*";const L={block:"차단",allow:"허용",install:"설치"};
const setHTML=(el,h)=>{if(el._h!==h){el.innerHTML=h;el._h=h}};
const mb=n=>n?(n/1048576).toFixed(0)+" MB":"–";
function renderUpd(){
 setHTML($("#fpc"),'<option value="*">모든 PC</option>'+S.agents.map(a=>`<option value="${esc(a.id)}">${esc(a.host)}</option>`).join(""));$("#fpc").value=fpc;
 setHTML($("#fring"),'<option value="*">규칙 범위: 전체 링</option>'+Object.keys(S.policies).map(r=>`<option value="${r}">규칙 범위: ${r}</option>`).join(""));$("#fring").value=fscope;
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view==view));
 const A=S.agents.filter(a=>fpc=="*"||a.id==fpc),m=new Map();
 for(const a of A)for(const u of view=="pend"?a.pend:a.hist){
  const k=u.kb||u.title,r=m.get(k)||{kb:u.kb,title:u.title,pcs:new Set(),ok:0,bad:0,un:0,hid:0,last:"",size:u.size,sev:u.sev};
  r.pcs.add(a.host);
  if(view=="pend"){if(u.hid)r.hid++}else{if(u.op==2)r.un++;else if(u.rc==2||u.rc==3)r.ok++;else if(u.rc>=4)r.bad++;if(u.date>r.last)r.last=u.date}
  m.set(k,r)}
 const rows=[...m.values()].sort((a,b)=>view=="pend"?b.pcs.size-a.pcs.size:b.last.localeCompare(a.last));
 const chips=r=>S.rules.filter(x=>x.kb&&x.kb==r.kb).map(x=>`<span class="tag ${x.action=="block"?"er":x.action=="install"?"wn":"ok"}">${L[x.action]}·${x.ring=="*"?"전체":x.ring}</span>`).join(" ")||"–";
 const btn=r=>r.kb?["block","allow","install","none"].map(a=>`<button data-rule="${a}" data-kb="${r.kb}">${a=="none"?"해제":L[a]}</button>`).join(" "):'<span style="color:var(--mu)">KB 없음</span>';
 const pend=view=="pend";
 setHTML($("#uh"),`<tr><th>KB</th><th>제목</th>${pend?"<th>크기</th><th>심각도</th><th>대기 PC</th>":"<th>성공</th><th>실패</th><th>최근 일시</th>"}<th>규칙</th><th>조치</th></tr>`);
 setHTML($("#ub"),rows.length?rows.map(r=>`<tr><td class="m">${esc(r.kb||"–")}</td><td class="t">${esc(r.title)}</td>`+
  (pend?`<td class="m">${mb(r.size)}</td><td>${esc(r.sev||"–")}</td><td>${r.pcs.size}${r.hid?` <span class="tag er">숨김 ${r.hid}</span>`:""}</td>`
  :`<td>${r.ok}${r.un?` <span class="tag wn">제거 ${r.un}</span>`:""}</td><td>${r.bad?`<span class="tag er">${r.bad}</span>`:0}</td><td class="m">${esc(r.last.replace("T"," "))}</td>`)+
  `<td>${chips(r)}</td><td>${btn(r)}</td></tr>`).join(""):'<tr><td colspan="8" class="empty">보고된 항목이 없습니다. 위의 "목록 새로고침"을 눌러 보세요.</td></tr>');
 const one=S.agents.find(a=>a.id==fpc);
 $("#updts").textContent=one?"목록 갱신 "+ago(one.upd_ts):"목록 보고 "+S.agents.filter(a=>a.upd_ts).length+"/"+S.agents.length+"대";
}
async function rule(kb,action){
 if(action=="install"&&!confirm(kb+" 을(를) 선택한 범위의 모든 PC에 즉시 설치합니다. 계속할까요?"))return;
 await api("rule",{kb,ring:$("#fring").value,action});tick()}
function addRule(a){const kb=$("#kbin").value.trim().toUpperCase();
 if(!/^KB\d{5,8}$/.test(kb))return alert("KB 번호 형식이 올바르지 않습니다 (예: KB5050009)");rule(kb,a);$("#kbin").value=""}
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.view){view=t.dataset.view;renderUpd()}
 if(t.dataset.rule)rule(t.dataset.kb,t.dataset.rule)});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="fpc"){fpc=t.value;renderUpd()}if(t.id=="fring")fscope=t.value});
async function cmd(type){if(!sel.size)return alert("대상 PC를 선택하세요");await api("cmd",{ids:[...sel],type});tick()}
async function savePol(){let items;try{items=JSON.parse($("#pol").value)}catch(e){return alert("JSON 형식 오류: "+e.message)}
 await api("policy",{ring,items});loaded=null;tick()}
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.tab){ring=t.dataset.tab;loaded=null;render()}
 if(t.dataset.pre){let items;try{items=JSON.parse($("#pol").value)}catch(x){return alert("JSON 형식 오류")}
  for(const n of PRESETS[t.dataset.pre]){const i=items.findIndex(o=>o.path==n.path&&o.name==n.name);i<0?items.push(n):items[i]=n}
  $("#pol").value=JSON.stringify(items,null,2)}});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.id){t.checked?sel.add(t.dataset.id):sel.delete(t.dataset.id);render()}
 if(t.id=="all"){S.agents.forEach(a=>t.checked?sel.add(a.id):sel.delete(a.id));render()}
 if(t.dataset.ring){await api("ring",{id:t.dataset.ring,ring:t.value});tick()}});
tick();setInterval(tick,5000);
</script></body></html>
