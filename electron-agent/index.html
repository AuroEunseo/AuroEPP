<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>AURORA Endpoint Agent</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #090d16; color: #f1f5f9;
    font-family: 'Malgun Gothic', -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font-family: inherit; }
  svg { display: block; }

  /* 상단 바 */
  .top {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid rgba(148,163,184,0.14); flex: 0 0 auto; position: relative;
  }
  .back {
    display: none; align-items: center; gap: 4px; background: none; border: 1px solid rgba(148,163,184,0.25);
    color: #cbd5e1; border-radius: 8px; padding: 5px 10px 5px 6px; font-size: 12.5px; cursor: pointer;
  }
  .back:hover { border-color: #38bdf8; color: #e0f2fe; }
  body:not([data-view="home"]) .back { display: flex; }
  .title { font-size: 16px; font-weight: 700; color: #e2e8f0; }
  .spacer { flex: 1; }
  .chip { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #94a3b8; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #475569; flex: 0 0 7px; }
  .dot.ok { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,.6); }
  .dot.bad { background: #fb7185; }
  .bell {
    position: relative; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    background: #0f172a; border: 1px solid rgba(148,163,184,0.22); color: #cbd5e1;
    display: flex; align-items: center; justify-content: center;
  }
  .bell:hover, .bell.on { border-color: #38bdf8; color: #e0f2fe; }
  .bell .cnt {
    position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 9px; background: #f59e0b; color: #111827; font-size: 10.5px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .bell .cnt.show { display: flex; }
  .bell.busy svg { animation: ring 1.6s ease-in-out infinite; }
  @keyframes ring { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(12deg); } 20%,40% { transform: rotate(-12deg); } }

  /* 알림 패널 */
  .panel {
    display: none; position: absolute; top: 56px; right: 16px; width: 360px; max-height: 420px; overflow-y: auto;
    background: #0b1222; border: 1px solid rgba(148,163,184,0.28); border-radius: 12px; padding: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,.55); z-index: 10;
  }
  .panel.open { display: block; }
  .panel h4 { margin: 2px 2px 8px; font-size: 12px; color: #94a3b8; font-weight: 600; }
  .task { background: #0f172a; border: 1px solid rgba(148,163,184,0.16); border-radius: 9px; padding: 8px 10px; font-size: 12px; margin-bottom: 6px; }
  .task-head { display: flex; justify-content: space-between; gap: 8px; }
  .task-state { font-size: 11px; white-space: nowrap; }
  .task-state.run { color: #fbbf24; } .task-state.ok { color: #34d399; } .task-state.fail { color: #fb7185; }
  .task-detail { color: #94a3b8; font-size: 11px; margin-top: 3px; word-break: break-all; }
  .bar { height: 4px; background: #1e293b; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #38bdf8; transition: width .3s; }
  .muted { font-size: 12px; color: #64748b; padding: 6px 2px 10px; }

  main { flex: 1; overflow-y: auto; padding: 22px 24px; }
  .view { display: none; }
  body[data-view="home"] #v-home, body[data-view="store"] #v-store, body[data-view="server"] #v-server { display: block; }

  /* 메인 */
  .hello { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .tile {
    text-align: left; cursor: pointer; border-radius: 16px; padding: 26px 24px; min-height: 250px;
    background: linear-gradient(160deg, #111c33 0%, #0c1426 100%); border: 1px solid rgba(148,163,184,0.2);
    color: #f1f5f9; display: flex; flex-direction: column; transition: border-color .15s, transform .15s;
  }
  .tile:hover { border-color: #38bdf8; transform: translateY(-2px); }
  .tile .ic { width: 58px; height: 58px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .tile.store .ic { background: rgba(56,189,248,0.14); color: #38bdf8; }
  .tile.server .ic { background: rgba(129,140,248,0.15); color: #a5b4fc; }
  .tile .t { font-size: 21px; font-weight: 700; }
  .tile .d { font-size: 12.5px; color: #94a3b8; margin-top: 6px; line-height: 1.5; }
  .tile .s { margin-top: auto; padding-top: 18px; font-size: 12.5px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
  .strip {
    margin-top: 18px; display: none; align-items: center; gap: 10px; cursor: pointer;
    background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.3); border-radius: 10px; padding: 10px 14px; font-size: 12.5px;
  }
  .strip.show { display: flex; }
  .strip .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot { font-size: 11px; color: #475569; margin-top: 18px; text-align: center; }

  /* 공용 */
  .card { background: #0f172a; border: 1px solid rgba(148,163,184,0.2); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; }
  .btn {
    padding: 9px 14px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; font-weight: 700; font-size: 12.5px;
  }
  .btn.alt { background: #1e293b; border: 1px solid rgba(148,163,184,0.3); color: #e2e8f0; font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:not(:disabled):hover { opacity: .92; }
  input {
    width: 100%; background: #060a12; border: 1px solid rgba(148,163,184,0.3);
    border-radius: 8px; padding: 9px 11px; color: #fff; font-size: 13px;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  label { display: block; font-size: 11.5px; color: #94a3b8; margin-bottom: 5px; }

  /* 서버 연결 관리 */
  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: #0b1222; border: 1px solid rgba(148,163,184,0.16); border-radius: 10px; padding: 12px; }
  .stat .k { font-size: 11px; color: #64748b; }
  .stat .v { font-size: 13.5px; font-weight: 700; margin-top: 5px; display: flex; align-items: center; gap: 6px; word-break: break-all; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row .grow { flex: 1; }
  .row .port { flex: 0 0 110px; }
  .msg { margin-top: 10px; font-size: 12px; min-height: 18px; }
  .mono { font-family: Consolas, monospace; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 프로그램 설치 */
  .store-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .store-head input { width: 280px; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    background: #0f172a; border: 1px solid rgba(148,163,184,0.2); color: #94a3b8;
    font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .tab.on { color: #e0f2fe; border-color: #38bdf8; background: rgba(56,189,248,0.12); }
  .item {
    display: flex; gap: 14px; align-items: center; margin-bottom: 8px;
    background: #0f172a; border: 1px solid rgba(148,163,184,0.18); border-radius: 12px; padding: 12px 14px;
  }
  .icon {
    width: 46px; height: 46px; flex: 0 0 46px; border-radius: 11px; object-fit: contain;
    background: #111c33; display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; color: #e0f2fe;
  }
  img.icon { padding: 4px; }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 700; }
  .ver { font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 6px; }
  .meta { font-size: 11.5px; color: #64748b; margin-top: 2px; }
  .desc { font-size: 12px; color: #cbd5e1; margin-top: 5px; line-height: 1.45; word-break: keep-all; }
  .note { font-size: 11.5px; margin-top: 5px; color: #94a3b8; word-break: break-all; }
  .note.fail { color: #fb7185; } .note.wait { color: #fbbf24; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: 0 0 auto; }
  .side .btn { min-width: 98px; }
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: rgba(16,185,129,0.16); color: #34d399; }
  .tag.up { background: rgba(56,189,248,0.16); color: #7dd3fc; }
  .tag.appr { background: rgba(148,163,184,0.14); color: #94a3b8; }
  .empty, .error { text-align: center; padding: 50px 10px; font-size: 13px; color: #64748b; }
  .error { color: #fb7185; }
</style>
</head>
<body data-view="home">
  <div class="top">
    <button class="back" onclick="go('home')" title="메인으로">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      메인
    </button>
    <div class="title" id="title">AURORA Endpoint Agent</div>
    <div class="spacer"></div>
    <div class="chip" title="관제 서버 연결"><span id="netDot" class="dot"></span><span id="netTxt">서버 확인 중</span></div>
    <div class="chip" title="백그라운드 서비스"><span id="svcDot" class="dot"></span><span id="svcTxt">서비스 확인 중</span></div>
    <button class="bell" id="bell" onclick="togglePanel(event)" title="처리 중인 작업">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="cnt" id="bellCnt"></span>
    </button>
    <div class="panel" id="panel" onclick="event.stopPropagation()">
      <h4>처리 중인 작업</h4>
      <div id="activeList"></div>
      <h4 style="margin-top:10px;">최근 완료</h4>
      <div id="doneList"></div>
    </div>
  </div>

  <main>
    <!-- 메인 -->
    <section class="view" id="v-home">
      <div class="hello">원하는 작업을 선택하세요. 창을 닫아도 트레이에서 계속 실행됩니다.</div>
      <div class="tiles">
        <button class="tile store" onclick="go('store')">
          <div class="ic">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
          </div>
          <div class="t">프로그램 설치</div>
          <div class="d">회사에서 승인한 프로그램을<br />검색하고 바로 설치합니다.</div>
          <div class="s" id="homeStore">목록 확인 중...</div>
        </button>
        <button class="tile server" onclick="go('server')">
          <div class="ic">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01"/></svg>
          </div>
          <div class="t">서버 연결 관리</div>
          <div class="d">관제 서버 주소 설정과<br />연결·서비스 상태를 확인합니다.</div>
          <div class="s" id="homeServer"><span class="dot"></span>확인 중...</div>
        </button>
      </div>
      <div class="strip" id="strip" onclick="togglePanel(event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
        <span class="grow" id="stripTxt"></span>
        <span style="color:#94a3b8; font-size:11.5px;">자세히</span>
      </div>
    </section>

    <!-- 프로그램 설치 -->
    <section class="view" id="v-store">
      <div class="store-head">
        <input id="q" placeholder="프로그램 검색 (이름·게시자·설명)" />
        <div class="tabs">
          <button class="tab on" data-f="all">전체</button>
          <button class="tab" data-f="none">설치 안 됨</button>
          <button class="tab" data-f="update">업데이트</button>
          <button class="tab" data-f="installed">설치됨</button>
        </div>
      </div>
      <div id="list"><div class="empty">목록을 불러오는 중...</div></div>
      <div class="foot">'승인 필요' 프로그램은 관리자가 승인한 뒤 설치가 시작됩니다. 진행 상황은 오른쪽 위 알림에서 볼 수 있습니다.</div>
    </section>

    <!-- 서버 연결 관리 -->
    <section class="view" id="v-server">
      <div class="card">
        <div class="card-title">연결 상태</div>
        <div class="status-grid">
          <div class="stat"><div class="k">관제 서버</div><div class="v" id="stNet"><span class="dot"></span>확인 중</div></div>
          <div class="stat"><div class="k">백그라운드 서비스</div><div class="v" id="stSvc"><span class="dot"></span>확인 중</div></div>
          <div class="stat"><div class="k">Machine ID</div><div class="v mono" id="stMid" style="font-size:11.5px; font-weight:400;">-</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">관제 서버 주소</div>
        <div class="row">
          <div class="grow"><label>IP 또는 호스트명</label><input id="serverIp" class="mono" placeholder="예: 192.168.0.50" /></div>
          <div class="port"><label>포트</label><input id="serverPort" class="mono" type="number" placeholder="1557" /></div>
          <button class="btn" onclick="saveSettings()">저장 및 재연결</button>
        </div>
        <div id="statusMsg" class="msg"></div>
      </div>
      <div class="card">
        <div class="card-title">문제 해결</div>
        <div class="actions">
          <button class="btn alt" onclick="restartService()">백그라운드 서비스 재시작</button>
          <button class="btn alt" onclick="openLog()">연결 진단 로그 열기</button>
          <button class="btn alt" onclick="copyToken()">인증 토큰 복사 (콘솔 승인 대조용)</button>
        </div>
        <div id="toolMsg" class="msg"></div>
      </div>
    </section>
  </main>

<script>
  const api = window.agentApi;
  const TITLES = { home: 'AURORA Endpoint Agent', store: '프로그램 설치', server: '서버 연결 관리' };
  const ACTIVE = ['queued', 'sent', 'downloading', 'installing'];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtSize = (n) => n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
  let rawToken = '';
  let view = 'home';

  // ---------------- 화면 전환 (메인 / 프로그램 설치 / 서버 연결 관리) ----------------
  function go(v) {
    view = ['home', 'store', 'server'].includes(v) ? v : 'home';
    document.body.dataset.view = view;
    document.getElementById('title').textContent = TITLES[view];
    if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view);
    closePanel();
    if (view === 'store') document.getElementById('q').focus();
    if (view === 'server') loadState();
    loadCatalog();
  }
  if (api.onNavigate) api.onNavigate(go);

  // ---------------- 알림 (처리 중인 작업) ----------------
  function togglePanel(e) {
    e.stopPropagation();
    const p = document.getElementById('panel');
    p.classList.toggle('open');
    document.getElementById('bell').classList.toggle('on', p.classList.contains('open'));
  }
  function closePanel() {
    document.getElementById('panel').classList.remove('open');
    document.getElementById('bell').classList.remove('on');
  }
  document.addEventListener('click', closePanel);

  function taskHtml(t) {
    const cls = t.finished ? (t.ok ? 'ok' : 'fail') : 'run';
    const state = t.finished ? (t.ok ? '완료' : '실패') : t.status;
    const time = new Date((t.finished || t.started) * 1000).toLocaleTimeString('ko-KR');
    const pct = !t.finished && t.progress != null ? ' ' + t.progress + '%' : '';
    const bar = !t.finished && t.progress != null ? `<div class="bar"><div style="width:${t.progress}%"></div></div>` : '';
    return `<div class="task"><div class="task-head"><span>${esc(t.title)}</span>` +
      `<span class="task-state ${cls}">${esc(state)}${pct} · ${time}</span></div>` +
      (t.detail ? `<div class="task-detail">${esc(t.detail)}</div>` : '') + bar + '</div>';
  }

  async function loadTasks() {
    const tasks = await api.getTasks();
    const active = tasks.filter((t) => !t.finished);
    const done = tasks.filter((t) => t.finished).slice(-8).reverse();
    document.getElementById('activeList').innerHTML = active.length ? active.map(taskHtml).join('') : '<div class="muted">처리 중인 작업이 없습니다.</div>';
    document.getElementById('doneList').innerHTML = done.length ? done.map(taskHtml).join('') : '<div class="muted">최근 완료된 작업이 없습니다.</div>';
    const cnt = document.getElementById('bellCnt');
    cnt.textContent = active.length;
    cnt.classList.toggle('show', active.length > 0);
    document.getElementById('bell').classList.toggle('busy', active.length > 0);
    document.getElementById('strip').classList.toggle('show', active.length > 0);
    if (active.length) {
      const t = active[0];
      const pct = t.progress != null ? ` ${t.progress}%` : '';
      document.getElementById('stripTxt').textContent =
        `처리 중: ${t.title} — ${t.status}${pct}` + (active.length > 1 ? ` (외 ${active.length - 1}건)` : '');
    }
  }

  // ---------------- 연결 상태 ----------------
  function setDot(id, ok, text) {
    document.getElementById(id).innerHTML = `<span class="dot ${ok ? 'ok' : 'bad'}"></span>${esc(text)}`;
  }
  async function loadState() {
    const s = await api.getState();
    const svcOk = s.serviceStatus === 'RUNNING';
    const addr = `${s.config.server_ip}:${s.config.server_port}`;
    document.getElementById('netDot').className = 'dot ' + (s.serverReachable ? 'ok' : 'bad');
    document.getElementById('netTxt').textContent = s.serverReachable ? '서버 연결됨' : '서버 미연결';
    document.getElementById('svcDot').className = 'dot ' + (svcOk ? 'ok' : 'bad');
    document.getElementById('svcTxt').textContent = svcOk ? '서비스 가동' : '서비스 중지';
    setDot('homeServer', s.serverReachable, s.serverReachable ? `연결됨 · ${addr}` : `연결 안 됨 · ${addr}`);
    setDot('stNet', s.serverReachable, s.serverReachable ? `연결됨 (${addr})` : `연결 안 됨 (${addr})`);
    setDot('stSvc', svcOk, svcOk ? '가동 중' : s.serviceStatus === 'NOT_INSTALLED' ? '설치 안 됨' : '중지됨');
    document.getElementById('stMid').textContent = s.identity.machine_id || '서비스 시작 대기 중';
    rawToken = s.identity.agent_token || '';
    // 입력 중인 칸은 덮어쓰지 않음
    if (document.activeElement !== document.getElementById('serverIp')) document.getElementById('serverIp').value = s.config.server_ip || '127.0.0.1';
    if (document.activeElement !== document.getElementById('serverPort')) document.getElementById('serverPort').value = s.config.server_port || 1557;
  }
  function say(id, ok, text) {
    const m = document.getElementById(id);
    m.style.color = ok == null ? '#38bdf8' : ok ? '#34d399' : '#fb7185';
    m.textContent = text;
  }
  async function saveSettings() {
    say('statusMsg', null, '설정 저장 및 서비스 재시작 중...');
    const r = await api.saveConfig(document.getElementById('serverIp').value, document.getElementById('serverPort').value);
    say('statusMsg', r.ok, r.message);
    setTimeout(loadState, 1500);
  }
  async function restartService() {
    say('toolMsg', null, '서비스 재시작 중...');
    const r = await api.restartService();
    say('toolMsg', r.ok, r.message);
    setTimeout(loadState, 1500);
  }
  async function openLog() {
    if (!(await api.openLog())) say('toolMsg', false, '아직 기록된 로그가 없습니다.');
  }
  function copyToken() {
    if (!rawToken) return say('toolMsg', false, '아직 발급된 토큰이 없습니다 (서비스 시작 시 자동 생성).');
    navigator.clipboard.writeText(rawToken);
    say('toolMsg', true, '인증 토큰을 복사했습니다. 콘솔의 승인 대기 PC 토큰과 비교하세요.');
  }

  // ---------------- 프로그램 설치 ----------------
  let items = [];
  let catError = '';
  let filter = 'all';
  const pending = new Set(); // 요청 전송 중인 프로그램 ID
  const isBusy = (it) => !!it.request && it.request.action === 'install' && ACTIVE.includes(it.request.status);

  function itemView(it) {
    const r = it.request && it.request.action === 'install' ? it.request : null;
    const recent = (x) => Date.now() / 1000 - x.updated_at < 86400 * 3;
    if (pending.has(it.id)) return { btn: '요청 중...', disabled: true };
    if (r && r.status === 'requested') return { btn: '승인 대기 중', disabled: true, note: '관리자 승인을 기다리고 있습니다.', cls: 'wait' };
    if (r && ACTIVE.includes(r.status)) {
      return { btn: r.status_label, disabled: true, note: r.message || r.status_label, cls: 'wait', pct: r.status === 'downloading' ? r.progress : null };
    }
    let note = '', cls = '';
    if (r && r.status === 'failed' && recent(r)) { note = '최근 설치 실패: ' + r.message; cls = 'fail'; }
    if (r && r.status === 'rejected' && recent(r)) { note = r.message || '관리자가 요청을 거절했습니다.'; cls = 'fail'; }
    if (it.state === 'installed') return { btn: '설치됨', disabled: true, alt: true, note, cls };
    return { btn: it.state === 'update' ? '업데이트' : it.approval ? '설치 요청' : '설치', disabled: false, note, cls };
  }
  function tags(it) {
    const out = [];
    if (it.state === 'installed') out.push('<span class="tag ok">설치됨' + (it.installed_version ? ' ' + esc(it.installed_version) : '') + '</span>');
    if (it.state === 'update') out.push('<span class="tag up">새 버전 (현재 ' + esc(it.installed_version) + ')</span>');
    if (it.approval) out.push('<span class="tag appr">승인 필요</span>');
    return out.join(' ');
  }
  function iconHtml(it) {
    const letter = esc((it.name || '?').trim().charAt(0).toUpperCase());
    return it.has_icon
      ? `<img class="icon" data-icon="${it.id}" data-rev="${it.icon_rev}" alt="" /><div class="icon" data-fallback="${it.id}" style="display:none">${letter}</div>`
      : `<div class="icon">${letter}</div>`;
  }
  function renderHomeStore() {
    const el = document.getElementById('homeStore');
    if (catError) { el.innerHTML = '<span class="dot bad"></span>' + esc(catError); return; }
    const up = items.filter((i) => i.state === 'update').length;
    const busy = items.filter(isBusy).length;
    el.innerHTML = `<span class="dot ok"></span>설치 가능 ${items.length}개` + (up ? ` · 업데이트 ${up}개` : '') + (busy ? ` · 진행 중 ${busy}개` : '');
  }
  function renderStore() {
    const el = document.getElementById('list');
    if (catError && !items.length) { el.innerHTML = `<div class="error">${esc(catError)}</div>`; return; }
    const q = document.getElementById('q').value.trim().toLowerCase();
    const shown = items.filter((it) => (filter === 'all' || it.state === filter) &&
      (!q || [it.name, it.publisher, it.description, it.version].some((v) => String(v || '').toLowerCase().includes(q))));
    if (!shown.length) {
      el.innerHTML = `<div class="empty">${items.length ? '조건에 맞는 프로그램이 없습니다.' : '설치할 수 있도록 공개된 프로그램이 없습니다.'}</div>`;
      return;
    }
    el.innerHTML = shown.map((it) => {
      const v = itemView(it);
      const meta = [it.publisher, it.kind.toUpperCase() + ' · ' + fmtSize(it.size)].filter(Boolean).map(esc).join(' · ');
      return `<div class="item">${iconHtml(it)}
        <div class="body">
          <div class="name">${esc(it.name)}<span class="ver">${esc(it.version)}</span></div>
          <div class="meta">${meta}</div>
          ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
          ${v.note ? `<div class="note ${v.cls || ''}">${esc(v.note)}</div>` : ''}
          ${v.pct != null ? `<div class="bar"><div style="width:${Math.max(0, Math.min(100, v.pct))}%"></div></div>` : ''}
        </div>
        <div class="side">${tags(it)}
          <button class="btn ${v.alt ? 'alt' : ''}" data-req="${it.id}" ${v.disabled ? 'disabled' : ''}>${esc(v.btn)}</button>
        </div></div>`;
    }).join('');
    loadIcons();
  }
  async function loadIcons() {
    for (const img of document.querySelectorAll('img[data-icon]')) {
      const id = img.getAttribute('data-icon');
      const url = await api.catalogIcon(id, img.getAttribute('data-rev'));
      if (url) img.src = url;
      else {
        img.style.display = 'none';
        const fb = document.querySelector(`[data-fallback="${id}"]`);
        if (fb) fb.style.display = 'flex';
      }
    }
  }
  async function loadCatalog() {
    clearTimeout(loadCatalog.t);
    const r = await api.catalogList();
    catError = r.ok ? '' : r.error;
    if (r.ok) items = r.items;
    renderHomeStore();
    if (view === 'store') renderStore();
    const fast = items.some(isBusy) || pending.size;
    loadCatalog.t = setTimeout(loadCatalog, view === 'store' ? (fast ? 3000 : 15000) : 30000);
  }
  async function requestInstall(id) {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    const verb = it.approval ? '설치를 요청' : '설치';
    if (!confirm(`'${it.name} ${it.version}' 을(를) ${verb}할까요?` + (it.approval ? '\n관리자가 승인하면 자동으로 설치됩니다.' : '\n백그라운드로 설치되며, 끝나면 알림이 표시됩니다.'))) return;
    pending.add(id);
    renderStore();
    const r = await api.catalogRequest(id);
    pending.delete(id);
    if (!r.ok) alert(r.error || '요청하지 못했습니다.');
    loadCatalog();
  }
  document.getElementById('list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-req]');
    if (b && !b.disabled) requestInstall(parseInt(b.getAttribute('data-req'), 10));
  });
  document.getElementById('q').addEventListener('input', renderStore);
  for (const t of document.querySelectorAll('.tab')) {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
      t.classList.add('on');
      filter = t.getAttribute('data-f');
      renderStore();
    });
  }

  // ---------------- 시작 ----------------
  go(location.hash.slice(1) || 'home');
  loadState();
  setInterval(loadState, 5000);
  loadTasks();
  setInterval(loadTasks, 2000);
</script>
</body>
</html>
