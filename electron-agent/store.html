<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>프로그램 설치 센터</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 22px;
    background: #090d16; color: #f1f5f9;
    font-family: 'Malgun Gothic', -apple-system, sans-serif;
  }
  .header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 18px; color: #38bdf8; }
  .sub { font-size: 11.5px; color: #64748b; margin-top: 4px; }
  .search {
    width: 260px; background: #060a12; border: 1px solid rgba(148,163,184,0.3);
    border-radius: 8px; padding: 8px 11px; color: #fff; font-size: 13px;
  }
  .search:focus { outline: none; border-color: #38bdf8; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    background: #0f172a; border: 1px solid rgba(148,163,184,0.2); color: #94a3b8;
    font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .tab.on { color: #e0f2fe; border-color: #38bdf8; background: rgba(56,189,248,0.12); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; gap: 14px; align-items: center;
    background: #0f172a; border: 1px solid rgba(148,163,184,0.18); border-radius: 10px; padding: 12px 14px;
  }
  .icon {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 10px; object-fit: contain;
    background: #111c33; display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; color: #e0f2fe;
  }
  img.icon { padding: 4px; }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 700; }
  .ver { font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 6px; }
  .meta { font-size: 11.5px; color: #64748b; margin-top: 2px; }
  .desc { font-size: 12px; color: #cbd5e1; margin-top: 5px; line-height: 1.45; word-break: keep-all; }
  .note { font-size: 11.5px; margin-top: 5px; color: #94a3b8; word-break: break-all; }
  .note.fail { color: #fb7185; } .note.ok { color: #34d399; } .note.wait { color: #fbbf24; }
  .bar { height: 4px; background: #1e293b; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #38bdf8; transition: width .3s; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: 0 0 auto; }
  .btn {
    min-width: 96px; padding: 7px 12px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; font-weight: 700; font-size: 12.5px;
  }
  .btn.alt { background: #1e293b; border: 1px solid rgba(148,163,184,0.3); color: #e2e8f0; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: rgba(16,185,129,0.16); color: #34d399; }
  .tag.up { background: rgba(56,189,248,0.16); color: #7dd3fc; }
  .tag.wait { background: rgba(251,191,36,0.16); color: #fbbf24; }
  .tag.appr { background: rgba(148,163,184,0.14); color: #94a3b8; }
  .empty, .error { text-align: center; padding: 50px 10px; font-size: 13px; color: #64748b; }
  .error { color: #fb7185; }
  .foot { font-size: 11px; color: #475569; margin-top: 14px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>프로그램 설치 센터</h1>
      <div class="sub">회사에서 승인한 프로그램을 직접 설치할 수 있습니다. 설치는 백그라운드로 진행됩니다.</div>
    </div>
    <input id="q" class="search" placeholder="프로그램 검색 (이름·게시자·설명)" autofocus />
  </div>
  <div class="tabs">
    <button class="tab on" data-f="all">전체</button>
    <button class="tab" data-f="none">설치 안 됨</button>
    <button class="tab" data-f="update">업데이트</button>
    <button class="tab" data-f="installed">설치됨</button>
  </div>
  <div id="list" class="list"><div class="empty">목록을 불러오는 중...</div></div>
  <div class="foot">설치 진행 상황은 트레이 아이콘 메뉴의 '진행 중인 작업'에서도 볼 수 있습니다.<br />
    '승인 필요' 프로그램은 관리자가 승인한 뒤 설치가 시작됩니다.</div>

<script>
  const ACTIVE = ['queued', 'sent', 'downloading', 'installing'];
  let items = [];
  let filter = 'all';
  let lastError = '';
  const pending = new Set(); // 요청 전송 중인 프로그램 ID

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtSize = (n) => n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';

  function isActive(it) {
    const r = it.request;
    return !!r && r.action === 'install' && ACTIVE.includes(r.status);
  }

  function view(it) {
    const r = it.request && it.request.action === 'install' ? it.request : null;
    if (pending.has(it.id)) return { btn: '요청 중...', disabled: true };
    if (r && r.status === 'requested') return { btn: '승인 대기 중', disabled: true, note: '관리자 승인을 기다리고 있습니다.', cls: 'wait' };
    if (r && ACTIVE.includes(r.status)) {
      const pct = r.status === 'downloading' ? r.progress : null;
      return { btn: r.status_label, disabled: true, note: r.message || r.status_label, cls: 'wait', pct };
    }
    let note = '', cls = '';
    if (r && r.status === 'failed' && Date.now() / 1000 - r.updated_at < 86400 * 3) { note = '최근 설치 실패: ' + r.message; cls = 'fail'; }
    if (r && r.status === 'rejected' && Date.now() / 1000 - r.updated_at < 86400 * 3) { note = r.message || '관리자가 요청을 거절했습니다.'; cls = 'fail'; }
    if (it.state === 'installed') return { btn: '설치됨', disabled: true, alt: true, note, cls };
    const label = it.state === 'update' ? '업데이트' : it.approval ? '설치 요청' : '설치';
    return { btn: label, disabled: false, note, cls };
  }

  function tags(it) {
    const out = [];
    if (it.state === 'installed') out.push('<span class="tag ok">설치됨' + (it.installed_version ? ' ' + esc(it.installed_version) : '') + '</span>');
    if (it.state === 'update') out.push('<span class="tag up">새 버전 있음 (현재 ' + esc(it.installed_version) + ')</span>');
    if (it.approval) out.push('<span class="tag appr">승인 필요</span>');
    return out.join(' ');
  }

  function iconHtml(it) {
    const letter = esc((it.name || '?').trim().charAt(0).toUpperCase());
    return it.has_icon
      ? `<img class="icon" data-icon="${it.id}" data-rev="${it.icon_rev}" alt="" /><div class="icon" data-fallback="${it.id}" style="display:none">${letter}</div>`
      : `<div class="icon">${letter}</div>`;
  }

  function render() {
    const el = document.getElementById('list');
    if (lastError && !items.length) { el.innerHTML = `<div class="error">${esc(lastError)}</div>`; return; }
    const q = document.getElementById('q').value.trim().toLowerCase();
    const shown = items.filter((it) => {
      if (filter !== 'all' && it.state !== filter) return false;
      if (!q) return true;
      return [it.name, it.publisher, it.description, it.version].some((v) => String(v || '').toLowerCase().includes(q));
    });
    if (!shown.length) {
      el.innerHTML = `<div class="empty">${items.length ? '조건에 맞는 프로그램이 없습니다.' : '설치 센터에 공개된 프로그램이 없습니다.'}</div>`;
      return;
    }
    el.innerHTML = shown.map((it) => {
      const v = view(it);
      const meta = [it.publisher, it.kind.toUpperCase() + ' · ' + fmtSize(it.size)].filter(Boolean).map(esc).join(' · ');
      return `<div class="item">
        ${iconHtml(it)}
        <div class="body">
          <div class="name">${esc(it.name)}<span class="ver">${esc(it.version)}</span></div>
          <div class="meta">${meta}</div>
          ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
          ${v.note ? `<div class="note ${v.cls || ''}">${esc(v.note)}</div>` : ''}
          ${v.pct != null ? `<div class="bar"><div style="width:${Math.max(0, Math.min(100, v.pct))}%"></div></div>` : ''}
        </div>
        <div class="side">
          ${tags(it)}
          <button class="btn ${v.alt ? 'alt' : ''}" data-req="${it.id}" ${v.disabled ? 'disabled' : ''}>${esc(v.btn)}</button>
        </div>
      </div>`;
    }).join('');
    loadIcons();
  }

  async function loadIcons() {
    for (const img of document.querySelectorAll('img[data-icon]')) {
      const id = img.getAttribute('data-icon');
      const url = await window.agentApi.catalogIcon(id, img.getAttribute('data-rev'));
      if (url) img.src = url;
      else {
        img.style.display = 'none';
        const fb = document.querySelector(`[data-fallback="${id}"]`);
        if (fb) fb.style.display = 'flex';
      }
    }
  }

  async function load() {
    const r = await window.agentApi.catalogList();
    lastError = r.ok ? '' : r.error;
    if (r.ok) items = r.items;
    // 버튼을 누르는 중에는 다시 그리지 않음
    if (!document.querySelector('.btn:active')) render();
    clearTimeout(load.t);
    load.t = setTimeout(load, items.some(isActive) || pending.size ? 3000 : 15000);
  }

  async function request(id) {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    const verb = it.approval ? '설치를 요청' : '설치';
    if (!confirm(`'${it.name} ${it.version}' 을(를) ${verb}할까요?` + (it.approval ? '\n관리자가 승인하면 자동으로 설치됩니다.' : '\n백그라운드로 설치되며, 끝나면 알림이 표시됩니다.'))) return;
    pending.add(id);
    render();
    const r = await window.agentApi.catalogRequest(id);
    pending.delete(id);
    if (!r.ok) alert(r.error || '요청하지 못했습니다.');
    load();
  }

  document.getElementById('list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-req]');
    if (b && !b.disabled) request(parseInt(b.getAttribute('data-req'), 10));
  });
  document.getElementById('q').addEventListener('input', render);
  for (const t of document.querySelectorAll('.tab')) {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
      t.classList.add('on');
      filter = t.getAttribute('data-f');
      render();
    });
  }
  load();
</script>
</body>
</html>
